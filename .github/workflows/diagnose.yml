name: Scout Gemini Diagnose

# Manual one-off: shows whether the free-tier blocker is the model or the
# google_search grounding tool. Run from the Actions tab; reads GEMINI_API_KEY.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --omit=dev || npm install --omit=dev
      - name: Run diagnostic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node diagnose.js

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scout · Gemini</title>
  <style>
    :root {
      --bg: #0f1117; --panel: #171a23; --border: #262b38;
      --text: #e7eaf0; --muted: #8b92a5; --accent: #7c9cff; --user: #22303f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header .dot { width: 9px; height: 9px; border-radius: 50%; background: #f0b429; }
    header .dot.ok { background: #34d399; }
    header .model { margin-left: auto; font-size: 12px; color: var(--muted); }
    #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 720px; padding: 12px 15px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.model { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
    .msg.error { align-self: center; color: #ff9b9b; font-size: 13px; }
    form { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border); }
    textarea {
      flex: 1; resize: none; background: var(--panel); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 12px; font: inherit; height: 46px;
    }
    button {
      background: var(--accent); color: #0b0d13; border: none; border-radius: 10px;
      padding: 0 22px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="status"></span>
    <h1>Scout · Gemini</h1>
    <span class="model" id="model">connecting…</span>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="Ask Gemini…  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
    <button type="submit" id="send">Send</button>
  </form>

  <script type="module">
    import { ScoutGemini } from "/scoutGemini.js";

    const gemini = new ScoutGemini({ baseUrl: "" }); // same origin
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = [];

    function bubble(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    // Health check for the status pill.
    fetch("/health").then(r => r.json()).then(h => {
      document.getElementById("status").classList.toggle("ok", h.keyConfigured);
      document.getElementById("model").textContent =
        h.keyConfigured ? h.model : "no API key — set GEMINI_API_KEY";
    }).catch(() => {
      document.getElementById("model").textContent = "server offline";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      send.disabled = true;
      bubble("user", text);
      history.push({ role: "user", content: text });

      const out = bubble("model", "");
      try {
        const full = await gemini.chatStream(history, (delta) => {
          out.textContent += delta;
          log.scrollTop = log.scrollHeight;
        });
        history.push({ role: "assistant", content: full });
      } catch (err) {
        out.remove();
        bubble("error", err.message);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    // Enter to send, Shift+Enter for newline.
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
